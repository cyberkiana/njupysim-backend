# =====================================================================
# NJUPTPhySim 虚拟机 nginx 配置（放在虚拟机 /etc/nginx/nginx.conf）
# 功能：
#   1. /api/    反向代理 → Windows宿主机上的 Spring Boot 后端(192.168.233.1:8081)
#   2. /avatar/ 头像静态传输（本地静态目录，带缓存）
#   3. /_avatar_upload/ 头像上传（WebDAV PUT，仅允许宿主机IP）
#   4. /       （可选）托管前端打包产物 dist
# 拓扑：Windows宿主机(192.168.233.1) 跑后端8081 + 前端vite开发
#       虚拟机(192.168.233.130) 跑 nginx:80 + MySQL:3306 + Redis:6379
# =====================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    # 头像上传大小限制（与后端 spring.servlet.multipart.max-file-size=5MB 对齐）
    client_max_body_size 5m;

    server {
        listen       80 default_server;
        server_name  192.168.233.130;

        # ============ 1. 反向代理：/api/ → Windows宿主机后端 ============
        # 前端请求 http://192.168.233.130/api/common/login
        #   → 转发到 http://192.168.233.1:8081/common/login（自动去掉 /api 前缀）
        location /api/ {
            proxy_pass http://192.168.233.1:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ============ 2. 头像静态传输 ============
        # 数据库中存的头像url形如 /avatar/B22060101_1694567890.jpg
        # 浏览器请求 http://192.168.233.130/avatar/xxx.jpg 由本机直接静态返回
        location /avatar/ {
            alias /data/nginx/avatar/;
            expires 7d;
            add_header Cache-Control "public";
            # 目录列表禁止列出，只允许按文件访问
            autoindex off;
        }

        # ============ 3. 头像上传（WebDAV PUT，仅允许宿主机）============
        # 后端 AvatarController 通过 HTTP PUT 把文件推到这里，落到同一静态目录
        location /_avatar_upload/ {
            alias /data/nginx/avatar/;
            dav_methods PUT;
            # 上传路径仅允许宿主机访问，防止外部直接写文件
            allow 192.168.233.1;
            deny all;
        }

        # ============ 4.（可选）生产模式托管前端dist ============
        # 把 frontend/njuptpsim 执行 npm run build 得到的 dist 上传到
        # /data/nginx/web/dist 后取消下面注释，即可用 http://192.168.233.130 直接访问页面
        # location / {
        #     root /data/nginx/web/dist;
        #     index index.html;
        #     try_files $uri $uri/ /index.html;
        # }
    }
}
