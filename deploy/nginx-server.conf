# =====================================================================
# NJUPTPhySim 单服务器一体化 nginx 配置（部署到独立服务器 /etc/nginx/nginx.conf）
#
# 与开发期"虚拟机版"的区别：前端、后端、MySQL、Redis、nginx 全在同一台服务器，
# 内部通信走 127.0.0.1，只有 80 端口对外。
#
# 目录约定（与部署指南一致，可按需修改）：
#   /opt/njuptphysim/            后端 jar + 生产配置
#   /data/nginx/web/dist/        前端静态文件
#   /data/nginx/avatar/          头像文件（nginx静态服务 + 后端WebDAV上传）
# =====================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 5m;   # 头像上传大小限制

    server {
        listen       80 default_server;
        server_name  _;

        # ============ 1. 前端静态页面（生产模式托管）============
        location / {
            root /data/nginx/web/dist;
            index index.html;
            # vue-router history 模式必需：刷新/直接访问子路由时回退到 index.html
            try_files $uri $uri/ /index.html;
        }

        # ============ 2. 反向代理：/api/ → 本机后端 ============
        location /api/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ============ 3. 头像静态传输 ============
        location /avatar/ {
            alias /data/nginx/avatar/;
            expires 7d;
            add_header Cache-Control "public";
            autoindex off;
        }

        # ============ 4. 头像上传（WebDAV PUT，仅允许本机后端）============
        location /_avatar_upload/ {
            alias /data/nginx/avatar/;
            dav_methods PUT;
            allow 127.0.0.1;
            deny all;
        }
    }
}
